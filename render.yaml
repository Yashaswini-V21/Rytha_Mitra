services:
  - type: web
    name: rytha-mitra
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.api.server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: PORT
        value: 8000
